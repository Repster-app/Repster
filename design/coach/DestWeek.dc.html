<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #111113; color: #EAEAEF;
      font-family: -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased; }
    a { color: #5B8DEF; } a:hover { color: #7BA4F2; }
  </style>
</helmet>
<div style="min-height: 874px; background: #111113; padding: 58px 16px 28px; display: flex; flex-direction: column; gap: 18px;">

  <div style="display: flex; align-items: center; gap: 10px;">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5B8DEF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    <div style="font-size: 28px; font-weight: 700; letter-spacing: -0.5px; color: #EAEAEF;">Coach</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.8px; color: #5C5C6E;">THIS WEEK</div>
    <div style="background: #1B1B1F; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 3px;">

      <div style="display: flex; align-items: center; gap: 12px; padding: 9px 0;">
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.5px; color: #5C5C6E; width: 32px;">MON</div>
        <div style="width: 7px; height: 7px; border-radius: 50%; background: #5EC269; flex-shrink: 0;"></div>
        <div style="font-size: 13px; font-weight: 500; color: #EAEAEF; flex-grow: 1;">Push Day</div>
        <div style="font-size: 12px; font-weight: 500; color: #5C5C6E; font-variant-numeric: tabular-nums;">17 sets</div>
      </div>
      <div style="height: 1px; background: rgba(255,255,255,0.06);"></div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 9px 0;">
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.5px; color: #5C5C6E; width: 32px;">TUE</div>
        <div style="width: 7px; height: 7px; border-radius: 50%; background: #262630; flex-shrink: 0;"></div>
        <div style="font-size: 13px; font-weight: 500; color: #5C5C6E; flex-grow: 1;">Rest</div>
      </div>
      <div style="height: 1px; background: rgba(255,255,255,0.06);"></div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 9px 0;">
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.5px; color: #5C5C6E; width: 32px;">WED</div>
        <div style="width: 7px; height: 7px; border-radius: 50%; background: #5EC269; flex-shrink: 0;"></div>
        <div style="font-size: 13px; font-weight: 500; color: #EAEAEF; flex-grow: 1;">Pull Day</div>
        <div style="font-size: 12px; font-weight: 500; color: #5C5C6E; font-variant-numeric: tabular-nums;">18 sets</div>
      </div>
      <div style="height: 1px; background: rgba(255,255,255,0.06);"></div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 9px 0;">
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.5px; color: #5B8DEF; width: 32px;">THU</div>
        <div style="width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #5B8DEF; background: transparent; flex-shrink: 0;"></div>
        <div style="font-size: 13px; font-weight: 600; color: #5B8DEF; flex-grow: 1;">Legs — suggested</div>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#5B8DEF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div style="height: 1px; background: rgba(255,255,255,0.06);"></div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 9px 0;">
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.5px; color: #5C5C6E; width: 32px;">FRI</div>
        <div style="width: 7px; height: 7px; border-radius: 50%; background: #262630; flex-shrink: 0;"></div>
        <div style="font-size: 13px; font-weight: 500; color: #5C5C6E; flex-grow: 1;">Open</div>
      </div>

    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.8px; color: #5C5C6E;">HOW LONG SINCE</div>
    <div style="background: #1B1B1F; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="font-size: 12px; font-weight: 500; color: #9999A8; width: 62px;">Legs</div>
        <div style="flex-grow: 1; height: 7px; background: #262630; border-radius: 3px; overflow: hidden;"><div style="height: 100%; width: 100%; background: #5B8DEF; border-radius: 3px;"></div></div>
        <div style="font-size: 12px; font-weight: 600; color: #5B8DEF; font-variant-numeric: tabular-nums; width: 42px; text-align: right;">16d</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="font-size: 12px; font-weight: 500; color: #9999A8; width: 62px;">Chest</div>
        <div style="flex-grow: 1; height: 7px; background: #262630; border-radius: 3px; overflow: hidden;"><div style="height: 100%; width: 25%; background: #5C5C6E; border-radius: 3px;"></div></div>
        <div style="font-size: 12px; font-weight: 600; color: #9999A8; font-variant-numeric: tabular-nums; width: 42px; text-align: right;">4d</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="font-size: 12px; font-weight: 500; color: #9999A8; width: 62px;">Back</div>
        <div style="flex-grow: 1; height: 7px; background: #262630; border-radius: 3px; overflow: hidden;"><div style="height: 100%; width: 13%; background: #5C5C6E; border-radius: 3px;"></div></div>
        <div style="font-size: 12px; font-weight: 600; color: #9999A8; font-variant-numeric: tabular-nums; width: 42px; text-align: right;">2d</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="font-size: 12px; font-weight: 500; color: #9999A8; width: 62px;">Shoulders</div>
        <div style="flex-grow: 1; height: 7px; background: #262630; border-radius: 3px; overflow: hidden;"><div style="height: 100%; width: 25%; background: #5C5C6E; border-radius: 3px;"></div></div>
        <div style="font-size: 12px; font-weight: 600; color: #9999A8; font-variant-numeric: tabular-nums; width: 42px; text-align: right;">4d</div>
      </div>
    </div>
  </div>

  <div style="background: #1B1B1F; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 11px;">
    <div style="font-size: 15px; font-weight: 600; letter-spacing: -0.15px; color: #EAEAEF;">Legs, when you're ready</div>
    <div style="font-size: 13px; font-weight: 500; line-height: 1.45; color: #9999A8; text-wrap: pretty;">Your usual legs day, with squat first because it costs you the most per set.</div>
    <div style="border: 1px solid rgba(91,141,239,0.35); border-radius: 11px; padding: 11px; text-align: center; font-size: 14px; font-weight: 600; color: #5B8DEF;">Set it up</div>
  </div>

</div>
</x-dc>
</body>
</html>

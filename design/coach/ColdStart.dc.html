<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #111113; color: #EAEAEF;
      font-family: -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased; }
    a { color: #5B8DEF; } a:hover { color: #7BA4F2; }
  </style>
</helmet>
<div style="min-height: 560px; background: #111113; padding: 26px 16px; display: flex; flex-direction: column; gap: 18px;">

  <div style="display: flex; align-items: center; gap: 10px;">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5B8DEF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.5px; color: #EAEAEF;">Coach</div>
  </div>

  <div style="background: #1B1B1F; border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 11px;">
    <div style="width: 34px; height: 34px; border-radius: 10px; background: rgba(94,194,105,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5EC269" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 7"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
      <div style="font-size: 14px; font-weight: 600; color: #EAEAEF;">Bench Press is calibrated</div>
      <div style="font-size: 12px; font-weight: 500; color: #9999A8; text-wrap: pretty;">Next time you bench, set one arrives with a load on it.</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.8px; color: #5C5C6E;">THIS WEEK</div>
    <div style="background: #1B1B1F; border-radius: 14px; padding: 14px; display: flex; gap: 8px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 22px; font-weight: 700; color: #EAEAEF; font-variant-numeric: tabular-nums; letter-spacing: -0.4px;">2</div>
        <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.5px; color: #5C5C6E;">WORKOUTS</div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 22px; font-weight: 700; color: #EAEAEF; font-variant-numeric: tabular-nums; letter-spacing: -0.4px;">7</div>
        <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.5px; color: #5C5C6E;">EXERCISES</div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 22px; font-weight: 700; color: #EAEAEF; font-variant-numeric: tabular-nums; letter-spacing: -0.4px;">24</div>
        <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.5px; color: #5C5C6E;">SETS</div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.8px; color: #5C5C6E;">MUSCLES TRAINED</div>
    <div style="background: #1B1B1F; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="font-size: 12px; font-weight: 500; color: #9999A8; width: 66px;">Chest</div>
        <div style="height: 7px; width: 46%; background: #5B8DEF; border-radius: 3px;"></div>
        <div style="font-size: 12px; font-weight: 600; color: #EAEAEF; font-variant-numeric: tabular-nums;">8</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="font-size: 12px; font-weight: 500; color: #9999A8; width: 66px;">Back</div>
        <div style="height: 7px; width: 58%; background: #5B8DEF; border-radius: 3px;"></div>
        <div style="font-size: 12px; font-weight: 600; color: #EAEAEF; font-variant-numeric: tabular-nums;">10</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="font-size: 12px; font-weight: 500; color: #9999A8; width: 66px;">Shoulders</div>
        <div style="height: 7px; width: 34%; background: #5B8DEF; border-radius: 3px;"></div>
        <div style="font-size: 12px; font-weight: 600; color: #EAEAEF; font-variant-numeric: tabular-nums;">6</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>

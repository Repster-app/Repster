<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #111113; color: #EAEAEF;
      font-family: -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased; }
    a { color: #5B8DEF; } a:hover { color: #7BA4F2; }
  </style>
</helmet>
<div style="background: #111113; padding: 20px 16px; display: flex; flex-direction: column; gap: 10px;">
  <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.8px; color: #5C5C6E;">COACH</div>
  <div style="background: #1B1B1F; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 15px; font-weight: 600; color: #EAEAEF; letter-spacing: -0.15px;">Legs, or push again?</div>
    <div style="display: flex; gap: 8px;">
      <div style="flex-grow: 1; border: 1px solid rgba(91,141,239,0.35); background: rgba(91,141,239,0.08); border-radius: 11px; padding: 10px 11px; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 13px; font-weight: 600; color: #EAEAEF;">Legs</div>
        <div style="font-size: 11px; font-weight: 500; color: #5B8DEF; font-variant-numeric: tabular-nums;">16 days · 11 over</div>
      </div>
      <div style="flex-grow: 1; border: 1px solid rgba(255,255,255,0.08); border-radius: 11px; padding: 10px 11px; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 13px; font-weight: 600; color: #EAEAEF;">Push</div>
        <div style="font-size: 11px; font-weight: 500; color: #5C5C6E; font-variant-numeric: tabular-nums;">4 days · on time</div>
      </div>
    </div>
    <div style="font-size: 12px; font-weight: 500; color: #9999A8; text-wrap: pretty;">You usually go 5 days between legs sessions.</div>
  </div>
</div>
</x-dc>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      background: #111113;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #5B8DEF; }
    a:hover { color: #7BA5F3; }
  </style>
</helmet>
<div style="width: 360px; height: 640px; background: #0E0E11; color: #EAEAEF; display: flex; flex-direction: column; padding: 34px 30px 30px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;">
  <div style="flex-grow: 0.55;"></div>

  <div style="flex: none; display: flex; flex-direction: column; gap: 6px;">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #5B8DEF;">Push Day A</span>
    <span style="font-size: 13px; color: #5C5C6E;">5 lifts &middot; 18 sets &middot; 1h 4m</span>
  </div>

  <div style="height: 28px; flex: none;"></div>

  <div style="flex: none; display: flex; flex-direction: column;">
      <div style="display: flex; align-items: baseline; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.06);">
        <span style="font-size: 14px; color: #9999A8;">Barbell Bench Press</span>
        <span style="flex-grow: 1;"></span><span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: #EAEAEF;">4 &times; 92.5 kg</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.06);">
        <span style="font-size: 14px; color: #9999A8;">Overhead Press</span>
        <span style="flex-grow: 1;"></span><span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: #EAEAEF;">4 &times; 55 kg</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.06);">
        <span style="font-size: 14px; color: #9999A8;">Incline Dumbbell Press</span>
        <span style="flex-grow: 1;"></span><span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: #EAEAEF;">3 &times; 30 kg</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.06);">
        <span style="font-size: 14px; color: #9999A8;">Lateral Raise</span>
        <span style="flex-grow: 1;"></span><span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: #EAEAEF;">4 &times; 12 kg</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 12px; padding: 11px 0;">
        <span style="font-size: 14px; color: #9999A8;">Cable Pushdown</span>
        <span style="flex-grow: 1;"></span><span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: #EAEAEF;">3 &times; 35 kg</span>
      </div>
  </div>

  <div style="height: 26px; flex: none;"></div>

  <div style="flex: none; display: flex; align-items: center; gap: 8px; padding: 11px 13px; background: rgba(212,162,58,0.10); border: 1px solid rgba(212,162,58,0.20); border-radius: 12px;">
    <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .8l1.6 3.3 3.6.5-2.6 2.5.6 3.6L6 9l-3.2 1.7.6-3.6L.8 4.6l3.6-.5L6 .8Z" fill="#D4A23A"></path></svg>
    <span style="font-size: 13px; font-weight: 600; color: #D4A23A;">Bench and row both went to a new best</span>
  </div>

  <div style="flex-grow: 1;"></div>
  <div style="flex: none; display: flex; align-items: center; gap: 10px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.08);">
    <span style="font-size: 11px; font-variant-numeric: tabular-nums; color: #5C5C6E;">Sat, Aug 30</span>
    <span style="flex-grow: 1;"></span>
    <span style="display: flex; align-items: center; gap: 7px;">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="4.4" width="12" height="5.2" rx="1.4" fill="#5B8DEF"></rect><rect x="0" y="2.6" width="2.6" height="8.8" rx="1.1" fill="#5B8DEF"></rect><rect x="11.4" y="2.6" width="2.6" height="8.8" rx="1.1" fill="#5B8DEF"></rect></svg>
      <span style="font-size: 13px; font-weight: 700; letter-spacing: -0.01em; color: #EAEAEF;">Repster</span>
      <span style="font-size: 11px; color: #5C5C6E;">repster.app</span>
    </span>
  </div>
</div>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111113;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #5B8DEF; }
    a:hover { color: #7BA5F3; }
  </style>
</helmet>

<div style="width: 390px; height: 780px; background: #111113; color: #EAEAEF; display: flex; flex-direction: column;">
  <div style="display: flex; align-items: center; padding: 12px 16px; flex: none;"><div style="width: 32px; height: 32px; border-radius: 50%; background: #1F1F25; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M1.5 1.5 L10.5 10.5 M10.5 1.5 L1.5 10.5" stroke="#9999A8" stroke-width="1.8" stroke-linecap="round"></path></svg></div></div>
  <div style="flex-grow: 1; overflow: hidden; padding: 8px 24px 0; display: flex; flex-direction: column;">

    <div style="display: flex; flex-direction: column; gap: 3px;">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #5C5C6E;">Sat, Aug 30</div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="font-size: 15px; font-weight: 600; color: #9999A8;">Push Day A</div>
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11.2 2.3a1.6 1.6 0 0 1 2.3 2.3L5.6 12.5l-3 .7.7-3 7.9-7.9Z" stroke="#5C5C6E" stroke-width="1.4" stroke-linejoin="round"></path></svg>
      </div>
    </div>

    <div style="height: 54px;"></div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-family: ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; font-size: 82px; font-weight: 700; letter-spacing: -0.045em; line-height: 0.88; font-variant-numeric: tabular-nums; color: #EAEAEF;">12,450</div>
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #9999A8;">Kilos moved</div>
    </div>

    <div style="height: 40px;"></div>

    <div style="width: 44px; height: 2px; background: #D4A23A; border-radius: 1px;"></div>

    <div style="height: 18px;"></div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 17px; font-weight: 600; color: #D4A23A;">2 personal records</div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="font-size: 14px; color: #9999A8;">Barbell Bench Press</span>
          <span style="flex-grow: 1;"></span>
          <span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: #EAEAEF;">92.5 kg &times; 5</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="font-size: 14px; color: #9999A8;">Barbell Row</span>
          <span style="flex-grow: 1;"></span>
          <span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: #EAEAEF;">80 kg &times; 8</span>
        </div>
      </div>
    </div>

    <div style="flex-grow: 1;"></div>

    <div style="display: flex; gap: 10px; padding-bottom: 20px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 18px;">
      <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; color: #EAEAEF;">1h 4m</div>
        <div style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #5C5C6E;">Time</div>
      </div>
      <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; color: #EAEAEF;">18</div>
        <div style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #5C5C6E;">Sets</div>
      </div>
      <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; color: #EAEAEF;">5</div>
        <div style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #5C5C6E;">Lifts</div>
      </div>
    </div>

  </div>
  <div style="flex: none; border-top: 1px solid rgba(255,255,255,0.06); padding: 12px 16px;">
    <div style="height: 52px; background: #5B8DEF; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #FFFFFF;">Save &amp; Close</div>
  </div>
</div>
</x-dc>
</body>
</html>

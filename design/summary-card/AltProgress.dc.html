<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #111113;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased; }
    a { color: #5B8DEF; } a:hover { color: #7BA5F3; }
  </style>
</helmet>
<div style="width: 360px; height: 640px; background: #111113; color: #EAEAEF; display: flex; flex-direction: column; padding: 32px 30px 28px; position: relative; overflow: hidden;">
  <div style="flex: none; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #D4A23A;">New personal record</div>
  <div style="height: 20px; flex: none;"></div>
  <div style="flex: none; font-size: 20px; font-weight: 600; color: #9999A8;">Barbell Bench Press</div>
  <div style="height: 6px; flex: none;"></div>
  <div style="flex: none; font-family: ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; font-size: 60px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; color: #D4A23A;">92.5 kg</div>

  <div style="flex-grow: 1;"></div>

  <svg width="100%" height="88" viewBox="0 0 300 88" fill="none" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A23A" stop-opacity="0.28"></stop>
      <stop offset="100%" stop-color="#D4A23A" stop-opacity="0"></stop>
    </linearGradient></defs>
    <path d="M 0,88 L 0,68.2 L 42.8571,59.4 L 85.7143,61.6 L 128.571,46.2 L 171.429,39.6 L 214.286,41.8 L 257.143,24.2 L 300,4.4 L 300,88 Z" fill="url(#g)"></path>
    <polyline points="0,68.2 42.8571,59.4 85.7143,61.6 128.571,46.2 171.429,39.6 214.286,41.8 257.143,24.2 300,4.4" stroke="#D4A23A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
    <circle cx="300" cy="4.4" r="5" fill="#D4A23A"></circle>
  </svg>

  <div style="height: 12px; flex: none;"></div>
  <div style="flex: none; display: flex; align-items: baseline; gap: 8px;">
    <span style="font-size: 15px; font-weight: 600; color: #5EC269;">+7.5 kg</span>
    <span style="font-size: 14px; color: #5C5C6E;">since June &middot; 8 sessions</span>
  </div>

  <div style="flex-grow: 1;"></div>
  <div style="flex: none; display: flex; align-items: center; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; color: #9999A8;"><span>1h 4m</span><span style="color: #5C5C6E;">&middot;</span><span>18 sets</span><span style="color: #5C5C6E;">&middot;</span><span>12,450 kg</span></div>
  <div style="height: 16px; flex: none;"></div>
  <div style="flex: none; display: flex; align-items: center; gap: 10px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.06);">
    <span style="font-size: 11px; font-variant-numeric: tabular-nums; color: #5C5C6E;">Sat, Aug 30</span>
    <span style="flex-grow: 1;"></span>
    <span style="display: flex; align-items: center; gap: 8px;"><img src="repster-mark.png" alt="" width="16" height="16" style="display: block; flex: none;">
      <span style="font-size: 15px; font-weight: 700; letter-spacing: -0.015em; color: #EAEAEF;">Repster</span>
      <span style="font-size: 11px; color: #5C5C6E;">repster.app</span>
    </span>
  </div>
</div>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #111113;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased; }
    a { color: #5B8DEF; } a:hover { color: #7BA5F3; }
  </style>
</helmet>
<div style="width: 360px; height: 640px; background: #111113; color: #EAEAEF; display: flex; flex-direction: column; padding: 32px 30px 28px; position: relative; overflow: hidden;">
  <div style="flex: none; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #5C5C6E;">Push Day A</div>
  <div style="height: 4px; flex: none;"></div>
  <div style="flex: none; font-size: 13px; color: #5C5C6E;">18 sets &middot; 1h 4m &middot; 12,450 kg</div>

  <div style="height: 22px; flex: none;"></div>

  <div style="flex: none; display: flex; flex-direction: column;">
    <div style="display: flex; flex-direction: column; gap: 3px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 14px; font-weight: 600; color: #EAEAEF;">Barbell Bench Press<span style="color: #D4A23A; font-size: 11px; font-weight: 700; padding-left: 6px;">PR</span></div>
      <div style="font-size: 13px; font-variant-numeric: tabular-nums; color: #9999A8; letter-spacing: 0.01em;">92.5×5 &nbsp; 92.5×5 &nbsp; 90×6 &nbsp; 85×8</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 3px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 14px; font-weight: 600; color: #EAEAEF;">Overhead Press</div>
      <div style="font-size: 13px; font-variant-numeric: tabular-nums; color: #9999A8; letter-spacing: 0.01em;">55×8 &nbsp; 55×8 &nbsp; 52.5×9 &nbsp; 50×10</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 3px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 14px; font-weight: 600; color: #EAEAEF;">Incline Dumbbell Press</div>
      <div style="font-size: 13px; font-variant-numeric: tabular-nums; color: #9999A8; letter-spacing: 0.01em;">30×10 &nbsp; 30×10 &nbsp; 27.5×12</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 3px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 14px; font-weight: 600; color: #EAEAEF;">Lateral Raise</div>
      <div style="font-size: 13px; font-variant-numeric: tabular-nums; color: #9999A8; letter-spacing: 0.01em;">12×15 &nbsp; 12×15 &nbsp; 10×18 &nbsp; 10×18</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 3px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06);">
      <div style="font-size: 14px; font-weight: 600; color: #EAEAEF;">Cable Pushdown</div>
      <div style="font-size: 13px; font-variant-numeric: tabular-nums; color: #9999A8; letter-spacing: 0.01em;">35×12 &nbsp; 35×12 &nbsp; 30×15</div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>
  <div style="flex: none; display: flex; align-items: center; gap: 10px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.06);">
    <span style="font-size: 11px; font-variant-numeric: tabular-nums; color: #5C5C6E;">Sat, Aug 30</span>
    <span style="flex-grow: 1;"></span>
    <span style="display: flex; align-items: center; gap: 8px;"><img src="repster-mark.png" alt="" width="16" height="16" style="display: block; flex: none;">
      <span style="font-size: 15px; font-weight: 700; letter-spacing: -0.015em; color: #EAEAEF;">Repster</span>
      <span style="font-size: 11px; color: #5C5C6E;">repster.app</span>
    </span>
  </div>
</div>
</x-dc>
</body>
</html>

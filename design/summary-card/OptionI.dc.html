<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111113;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #5B8DEF; }
    a:hover { color: #7BA5F3; }
  </style>
</helmet>

<div style="width: 390px; height: 780px; background: #111113; color: #EAEAEF; display: flex; flex-direction: column;">
  <div style="display: flex; align-items: center; padding: 12px 16px; flex: none;"><div style="width: 32px; height: 32px; border-radius: 50%; background: #1F1F25; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M1.5 1.5 L10.5 10.5 M10.5 1.5 L1.5 10.5" stroke="#9999A8" stroke-width="1.8" stroke-linecap="round"></path></svg></div></div>
  <div style="flex-grow: 1; overflow: hidden; padding: 0 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;">

    <div style="width: 56px; height: 56px; border-radius: 28px; background: rgba(94,194,105,0.10); border: 1px solid rgba(94,194,105,0.22); display: flex; align-items: center; justify-content: center;">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><path d="M6.5 13.4 L11 17.8 L19.5 8.6" stroke="#5EC269" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>

    <div style="height: 20px;"></div>

    <div style="font-size: 24px; font-weight: 600; color: #EAEAEF;">Saved</div>

    <div style="height: 8px;"></div>

    <div style="display: flex; align-items: center; gap: 7px; font-size: 14px; font-variant-numeric: tabular-nums; color: #9999A8;">
      <span>Push Day A</span>
      <span style="color: #5C5C6E;">&middot;</span>
      <span>18 sets</span>
      <span style="color: #5C5C6E;">&middot;</span>
      <span style="color: #D4A23A;">2 PRs</span>
    </div>

    <div style="height: 34px;"></div>

    <div style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 4px;">
      <span style="font-size: 15px; font-weight: 500; color: #5B8DEF;">See the full recap</span>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M4 2 L8 6 L4 10" stroke="#5B8DEF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>

  </div>
  <div style="flex: none; border-top: 1px solid rgba(255,255,255,0.06); padding: 12px 16px;">
    <div style="height: 52px; background: #5B8DEF; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #FFFFFF;">Done</div>
  </div>
</div>
</x-dc>
</body>
</html>

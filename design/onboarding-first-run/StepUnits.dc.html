<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <style>
    body { margin: 0; font-family: "DM Sans", system-ui, -apple-system, sans-serif; }
    a { color: #5B8DEF; text-decoration: none; }
    a:hover { color: #7BA5F3; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #111113; display: flex; flex-direction: column; box-sizing: border-box; padding: 60px 20px 34px;">

  <div style="display: flex; align-items: center; gap: 6px; padding-bottom: 18px;">
    <div style="width: 38px; height: 3px; border-radius: 2px; background: #5B8DEF;"></div>
    <div style="width: 38px; height: 3px; border-radius: 2px; background: #262630;"></div>
    <div style="font-size: 11px; font-weight: 600; color: #5C5C6E; letter-spacing: 0.08em; padding-left: 8px;">STEP 1 OF 2</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 24px;">
    <div style="font-size: 26px; font-weight: 700; color: #EAEAEF; line-height: 1.2; letter-spacing: -0.02em;">How do you measure?</div>
    <div style="font-size: 14px; font-weight: 400; color: #9999A8; line-height: 1.45;">You can change this any time in Settings.</div>
  </div>

  <div style="font-size: 11px; font-weight: 600; color: #5C5C6E; letter-spacing: 0.08em; padding-bottom: 9px;">UNITS</div>

  <div style="display: flex; gap: 10px;">
    <div onClick="{{ pickKg }}" style="flex-grow: 1; height: 56px; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: {{kgBg}}; border: 1px solid {{kgBorder}};">
      <div style="font-size: 19px; font-weight: 700; color: {{kgColor}};">kg</div>
      <div style="font-size: 11px; font-weight: 500; color: #5C5C6E;">Kilograms</div>
    </div>
    <div onClick="{{ pickLb }}" style="flex-grow: 1; height: 56px; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: {{lbBg}}; border: 1px solid {{lbBorder}};">
      <div style="font-size: 19px; font-weight: 700; color: {{lbColor}};">lb</div>
      <div style="font-size: 11px; font-weight: 500; color: #5C5C6E;">Pounds</div>
    </div>
  </div>

  <div style="font-size: 11px; font-weight: 600; color: #5C5C6E; letter-spacing: 0.08em; padding: 24px 0 9px;">BODYWEIGHT · OPTIONAL</div>

  <div style="height: 56px; border-radius: 12px; background: #1F1F25; border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; padding: 0 16px; gap: 8px;">
    <div style="font-size: 19px; font-weight: 700; color: #EAEAEF; flex-grow: 1;">{{weight}}</div>
    <div style="font-size: 14px; font-weight: 600; color: #5C5C6E;">{{unit}}</div>
  </div>

  <div style="font-size: 12px; font-weight: 400; color: #5C5C6E; line-height: 1.45; padding: 9px 2px 0;">
    Used for bodyweight exercises and strength-to-weight numbers. Skip it and add it later if you
    would rather not.
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="width: 100%; height: 52px; border-radius: 10px; background: #5B8DEF; display: flex; align-items: center; justify-content: center;">
    <div style="font-size: 16px; font-weight: 600; color: #FFFFFF;">Continue</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const unit = (this.state && this.state.unit) ? this.state.unit : 'kg';
    const isKg = unit === 'kg';
    return {
      unit: unit,
      weight: isKg ? '82' : '181',
      kgBg: isKg ? 'rgba(91,141,239,0.10)' : '#1B1B1F',
      kgBorder: isKg ? 'rgba(91,141,239,0.35)' : 'rgba(255,255,255,0.06)',
      kgColor: isKg ? '#5B8DEF' : '#9999A8',
      lbBg: isKg ? '#1B1B1F' : 'rgba(91,141,239,0.10)',
      lbBorder: isKg ? 'rgba(255,255,255,0.06)' : 'rgba(91,141,239,0.35)',
      lbColor: isKg ? '#9999A8' : '#5B8DEF',
      pickKg: () => this.setState({ unit: 'kg' }),
      pickLb: () => this.setState({ unit: 'lb' })
    };
  }
}
</script>
</body>
</html>

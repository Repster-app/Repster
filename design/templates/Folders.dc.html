<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="width: 390px; height: 844px; background: #111113; display: flex; flex-direction: column; overflow: hidden; color: #EAEAEF; position: relative;">

  <div style="flex-grow: 1; display: flex; flex-direction: column; opacity: 0.22; padding-top: 6px;">

    <div style="padding: 0 20px 8px 20px;"><span style="font-size: 10px; font-weight: 700; letter-spacing: 0.09em; color: #9999A8;">PPL BLOCK 2</span></div>
    <div style="display: flex; flex-direction: column; padding: 0 20px;">
      <div style="height: 60px; display: flex; align-items: center; gap: 13px; border-bottom: 1px solid rgba(255,255,255,0.06);">

        <div style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 15px; font-weight: 600;">Push Day A</span>

        </div>
      </div>
      <div style="height: 60px; display: flex; align-items: center; gap: 13px;">
        <div style="width: 4px; height: 32px; border-radius: 2px; background: #A87EE6;"></div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 15px; font-weight: 600;">Pull Day A</span>
          <span style="font-size: 11px; font-weight: 500; color: #5C5C6E;">5 ex · 19 sets · 6d ago</span>
        </div>
      </div>
    </div>
  </div>

  <div style="background: #1B1B1F; border-top: 1px solid rgba(255,255,255,0.10); border-radius: 22px 22px 0 0; padding: 10px 0 24px 0; display: flex; flex-direction: column; box-shadow: 0 -18px 44px rgba(0,0,0,0.5);">

    <div style="display: flex; justify-content: center; padding-bottom: 12px;">
      <div style="width: 38px; height: 4px; border-radius: 3px; background: #3A3A46;"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 3px; padding: 0 20px 16px 20px;">
      <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em; color: #EAEAEF;">Move to folder</span>
      <span style="font-size: 13px; font-weight: 500; color: #9999A8;">Push Day A</span>
    </div>

    <div style="display: flex; flex-direction: column; padding: 0 20px;">

      <div style="height: 56px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.06);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5B8DEF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5a2 2 0 012-2h4l2 2.4h8a2 2 0 012 2v8.6a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>

      </div>

      <div style="height: 56px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.06);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5C5C6E" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5a2 2 0 012-2h4l2 2.4h8a2 2 0 012 2v8.6a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
        <div style="flex-grow: 1; display: flex; align-items: baseline; gap: 7px;">

      </div>

      <div style="height: 56px; display: flex; align-items: center; gap: 12px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5B8DEF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        <div style="flex-grow: 1;">
          <span style="font-size: 16px; font-weight: 600; color: #5B8DEF;">New folder…</span>
        </div>
      </div>

    </div>

    <div style="padding: 16px 20px 0 20px;">
      <div style="height: 50px; border-radius: 13px; background: #5B8DEF; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 16px; font-weight: 600; color: #FFFFFF;">Done</span>

    </div>

  </div>

</div>
</x-dc>

</html>
